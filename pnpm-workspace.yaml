minimumReleaseAge: 0
publicHoistPattern:
  - '@vue/runtime-core'
  - exceljs

shellEmulator: true
trustPolicy: no-downgrade

overrides:
  '@vuepress/helper': 2.0.0-rc.31
  '@vuepress/highlighter-helper': 2.0.0-rc.31
  '@vuepress/plugin-active-header-links': 2.0.0-rc.31
  '@vuepress/plugin-back-to-top': 2.0.0-rc.31
  '@vuepress/plugin-copy-code': 2.0.0-rc.31
  '@vuepress/plugin-git': 2.0.0-rc.31
  '@vuepress/plugin-links-check': 2.0.0-rc.31
  '@vuepress/plugin-markdown-container': 2.0.0-rc.31
  '@vuepress/plugin-medium-zoom': 2.0.0-rc.31
  '@vuepress/plugin-nprogress': 2.0.0-rc.31
  '@vuepress/plugin-palette': 2.0.0-rc.31
  '@vuepress/plugin-prismjs': 2.0.0-rc.31
  '@vuepress/plugin-seo': 2.0.0-rc.31
  '@vuepress/plugin-sitemap': 2.0.0-rc.31
  '@vuepress/plugin-theme-data': 2.0.0-rc.31

packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - unrs-resolver
  - '@parcel/watcher'
  - vue-demi

registry: https://registry.npmmirror.com

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  vue-demi: true
